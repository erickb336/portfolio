<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workstation sample preview</title><link rel="stylesheet" href="/assets/studio/workstation.css?v=5"><style>body{background:#090b0a;color:#e3e7e4;font-family:system-ui;margin:0;padding:32px 20px}main{max-width:1050px;margin:auto}.section-top h2{font-size:25px;font-weight:500;margin:32px 0}.section-top h2 span{font:12px monospace;color:#788078;margin-right:18px}button{background:#161b18;color:#bdc6be;border:1px solid #384039;border-radius:6px;padding:9px;margin:0 8px 10px 0}p{color:#929d96;font-size:13px}</style><main><p>LOCAL PREVIEW · Sample data. Nothing here is a live visitor count.</p><nav><button data-state="online">Online</button><button data-state="idle">Idle</button><button data-state="partial">Partial</button><button data-state="disconnected">Disconnected</button><button data-state="error">Unavailable</button></nav><section id="workstation" data-preview aria-label="Workstation activity"><div class="section-top"><h2><span>04</span> At the desk</h2></div><div class="desk-console"><div class="desk-bar"><span>workstation</span><span data-desk-status role="status">● OFFLINE</span></div><div class="desk-body"><div class="desk-readout"><div><span>AGENTS</span><strong data-desk-agents>—</strong><small data-desk-agent-hint>status unavailable</small></div><div><span>TOKENS <span class="token-processing" data-token-processing aria-hidden="true"><i></i><i></i><i></i></span></span><strong data-desk-tokens>—</strong><small>processed today (PT)</small></div><div><span>SITE VISITS</span><strong>— / —</strong><small>this week / total</small></div></div><div class="desk-log"><p data-desk-line>Agent count unknown</p><p data-desk-heartbeat>No heartbeat yet</p></div></div></div></section></main><script type="module">
import {mountWorkstation} from '/assets/studio/workstation.js';
const base={"schemaVersion": 1, "status": "online", "tracker": "connected", "agents": {"active": 3, "coverage": "complete"}, "tokensToday": {"usageDate": "2026-10-02", "total": 128400, "input": 120000, "cachedInput": 96000, "output": 8400, "coverage": "complete"}, "lastHeartbeatAt": "2026-10-02T17:04:15.900Z", "asOf": "2026-10-02T17:04:27.000Z"};let state='online',dispose;
function start(){dispose?.();dispose=mountWorkstation(document.querySelector('#workstation'),{fetchStatus:async()=>{const d=structuredClone(base);d.asOf=new Date().toISOString();d.lastHeartbeatAt=new Date(Date.now()-12000).toISOString();if(state==='idle'){d.status='offline';d.agents.active=0;}if(state==='partial'){d.agents={active:2,coverage:'partial'};d.tokensToday.coverage='partial';}if(state==='disconnected'){d.status='offline';d.tracker='disconnected';d.agents={active:null,coverage:'unavailable'};}return {ok:state!=='error',json:async()=>d};}});}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{state=b.dataset.state;start();});start();</script>
